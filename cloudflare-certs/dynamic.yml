# Traefik Dynamic Configuration for Cloudflare Origin Certificates
# Cloudflare Strict Mode SSL - Uses Origin Certificate for end-to-end encryption
# Certificate: Valid for *.aquatiq.com and aquatiq.com
# Expiration: November 17, 2040

http:
  # External service routing for Aquatiq Tools (deployed separately)
  routers:
    tools:
      rule: "Host(`tools.aquatiq.com`)"
      entryPoints:
        - websecure
      service: tools-frontend
      tls:
        options: default
    
    tools-http:
      rule: "Host(`tools.aquatiq.com`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
  
  services:
    tools-frontend:
      loadBalancer:
        servers:
          - url: "http://aquatiq-tools-frontend:3000"

tls:
  # TLS Certificate Configuration
  certificates:
    - certFile: /certs/origin-cert.pem
      keyFile: /certs/origin-key.pem
      stores:
        - default
  
  # Default certificate store for all HTTPS connections
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin-cert.pem
        keyFile: /certs/origin-key.pem
  
  # TLS Options for Cloudflare Strict Mode
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
      curvePreferences:
        - CurveP384
        - CurveP256

